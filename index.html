<title>PetDeer 每日新闻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFFBF5;color:#1C1917;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loading{text-align:center}
.loading-icon{font-size:48px;margin-bottom:16px;animation:bounce 1s infinite}

.loading-brand{font-size:20px;font-weight:700;background:linear-gradient(135deg,#F97316,#FBBF24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>

<div class="loading">
