<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetDeer 每日新闻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loading{font-size:18px;color:rgba(255,255,255,0.6)}
</style>
</head>
<body>
<div class="loading">正在跳转到今日新闻...</div>
<script>
function redirect() {
  var d = new Date();
  var yyyy = d.getFullYear();
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  window.location.href = yyyy + '-' + mm + '-' + dd + '_每日新闻.html';
}
redirect();
</script>
</body>
</html>
